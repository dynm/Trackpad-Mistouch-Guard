name: macOS Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    env:
      HOME: ${{ github.workspace }}
      SWIFTPM_ENABLE_PLUGINS: 0
      SWIFTPM_MODULECACHE_OVERRIDE: ${{ github.workspace }}/.cache/swift-module
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/.cache/clang-module

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare SwiftPM caches
        run: mkdir -p .cache/swift-module .cache/clang-module

      - name: Show toolchain
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./script/build_and_run.sh bundle

      - name: Archive app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Mistouch Guard.app" "dist/Mistouch Guard.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Mistouch Guard
          path: dist/Mistouch Guard.zip

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" "dist/Mistouch Guard.zip" --clobber
